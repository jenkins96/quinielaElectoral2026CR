<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiniela Electoral 2026 - Google Sheets</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        
        .header-info { position: sticky; top: 0; background: #fff; padding: 15px 0; border-bottom: 2px solid #eee; margin-bottom: 20px; z-index: 10; }
        .status-bar { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2em; }
        .remaining { color: #f39c12; }
        .total { color: #27ae60; }
        .error-msg { color: #e74c3c; font-size: 0.9em; display: none; margin-top: 10px; font-weight: bold; }

        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"] { width: 100%; padding: 12px; border: 2px solid #dfe1e5; border-radius: 8px; box-sizing: border-box; font-size: 1em; }
        input[type="number"] { width: 90px; padding: 8px; border: 1px solid #ccc; border-radius: 5px; text-align: right; font-size: 1em; }
        
        .candidate-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f1f1; }
        .candidate-row label { flex: 1; margin: 0; font-weight: normal; }

        button { width: 100%; padding: 15px; background-color: #1a73e8; color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: bold; cursor: pointer; margin-top: 25px; transition: all 0.3s ease; }
        button:hover { background-color: #1557b0; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        button:disabled { background-color: #dadce0; cursor: not-allowed; box-shadow: none; }

        #loading { display: none; text-align: center; margin-top: 10px; color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h2>🗳️ Mi Quiniela Electoral</h2>
    
    <div class="form-group">
        <label for="participantName">Tu Nombre:</label>
        <input type="text" id="participantName" placeholder="Ej. Juan Pérez" required>
    </div>

    <div class="header-info">
        <div class="status-bar">
            <span>Restante: <span id="remainingValue" class="remaining">100.00</span>%</span>
            <span>Total: <span id="totalValue" class="total">0.00</span>%</span>
        </div>
        <p id="alertMessage" class="error-msg">⚠️ La suma debe ser exactamente 100% para poder enviar.</p>
    </div>

    <form id="quinielaForm">
        <div id="candidatesContainer">
            </div>

        <button type="submit" id="submitBtn" disabled>Enviar a Google Sheets</button>
        <div id="loading">Enviando datos, por favor espera...</div>
    </form>
</div>

<script>
    // Configuración: PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwXr-SV2S0skUtAHzX8JQ7W12dtKqJ6VhSFDzamVFiPb2yld50eLHGhxy4JjLg8Ngw/exec';

    const candidates = [
        "Candidato A", "Candidato B", "Candidato C", "Candidato D",
        "Candidato E", "Candidato F", "Candidato G", "Candidato H",
        "Candidato I", "Candidato J", "Candidato K"
    ];

    const container = document.getElementById('candidatesContainer');
    const totalDisplay = document.getElementById('totalValue');
    const remainingDisplay = document.getElementById('remainingValue');
    const submitBtn = document.getElementById('submitBtn');
    const alertMessage = document.getElementById('alertMessage');
    const loadingDiv = document.getElementById('loading');

    // Generar campos de entrada
    candidates.forEach((name, index) => {
        const div = document.createElement('div');
        div.className = 'candidate-row';
        div.innerHTML = `
            <label>${name}</label>
            <input type="number" class="candidate-input" step="0.01" min="0" max="100" placeholder="0.00">
        `;
        container.appendChild(div);
    });

    const inputs = document.querySelectorAll('.candidate-input');

    function calculateTotals() {
        let total = 0;
        inputs.forEach(input => {
            total += parseFloat(input.value) || 0;
        });

        total = Math.round(total * 100) / 100;
        const remaining = Math.round((100 - total) * 100) / 100;

        totalDisplay.innerText = total.toFixed(2);
        remainingDisplay.innerText = remaining.toFixed(2);

        // Validar si es exactamente 100
        const isCorrect = Math.abs(total - 100) < 0.001;
        submitBtn.disabled = !isCorrect;
        
        if (total > 100) {
            alertMessage.style.display = 'block';
            totalDisplay.style.color = '#e74c3c';
        } else {
            alertMessage.style.display = isCorrect ? 'none' : 'none';
            totalDisplay.style.color = isCorrect ? '#27ae60' : '#333';
        }
    }

    inputs.forEach(input => {
        input.addEventListener('input', calculateTotals);
    });

    // Envío de datos
    document.getElementById('quinielaForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('participantName').value;
        if (!name) return alert("Ingresa tu nombre");

        const votos = Array.from(inputs).map(i => parseFloat(i.value) || 0);

        // Bloquear interfaz
        submitBtn.disabled = true;
        loadingDiv.style.display = 'block';

        try {
            // Enviamos los datos como JSON a Google Apps Script
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // Importante para Google Apps Script
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ participante: name, votos: votos })
            });

            // Con no-cors no podemos leer la respuesta, pero si no hay error, asumimos éxito
            alert(`¡Excelente ${name}! Tus datos se han enviado a la hoja de cálculo.`);
            document.getElementById('quinielaForm').reset();
            calculateTotals();
            
        } catch (error) {
            console.error("Error:", error);
            alert("Error al conectar con Google Sheets.");
        } finally {
            loadingDiv.style.display = 'none';
        }
    });
</script>

</body>
</html>
